#serviços rodando
services:
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    networks:
      - net-victim
    ports:
      - "8081:80"   #127.0.0.1:8081

  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    networks:
      - net-victim
    ports:
      - "8082:3000"   #127.0.0.1:8082

  metasploitable:
    image: tleemcjr/metasploitable2
    container_name: metasploitable
    networks:
      - net-victim
    tty: true
    stdin_open: true



  attacker:
    build:
      context: .
      dockerfile: attacker.Dockerfile
    container_name: attacker
    cap_add:
      - NET_ADMIN                           #para a rota no arquivo attacker_entrypoint.sh
    networks:
      net-attacker:
        ipv4_address: 172.20.1.9            #ip fixo dentro da rede attacker
    tty: true
    stdin_open: true



  gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    container_name: gateway
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net-attacker:
        ipv4_address: 172.20.1.254
      net-victim:
        ipv4_address: 172.20.2.254
      net-monitor:
        ipv4_address: 172.20.3.254
    tty: true
    stdin_open: true  





networks:

  net-attacker:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24

  net-victim:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24

  net-monitor:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.3.0/24