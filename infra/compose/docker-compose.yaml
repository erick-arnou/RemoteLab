#serviços rodando
services:
  dvwa:
    image: ${DVWA_IMAGE}
    container_name: dvwa
    networks:
      - net-victim
    ports:
      - "${DVWA_PORT}:80"   #127.0.0.1:8081
    profiles: ["core", "full"]

  juice-shop:
    image: ${JUICESHOP_IMAGE}
    container_name: juice-shop
    networks:
      - net-victim
    ports:
      - "${JUICESHOP_PORT}:3000"   #127.0.0.1:8082
    profiles: ["full"]

  metasploitable:
    image: ${METASPLOITABLE_IMAGE}
    container_name: metasploitable
    networks:
      - net-victim
    tty: true
    stdin_open: true
    profiles: ["full"]



  attacker:
    build:
      context: .
      dockerfile: dockerfiles/attacker.Dockerfile
    container_name: attacker
    cap_add:
      - NET_ADMIN                           #para a rota no arquivo attacker_entrypoint.sh
    networks:
      net-attacker:
        ipv4_address: ${ATTACKER_IP}            #ip fixo dentro da rede attacker
    tty: true
    stdin_open: true
    profiles: ["core", "full"]



  gateway:
    build:
      context: .
      dockerfile: dockerfiles/gateway.Dockerfile
    container_name: gateway
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net-attacker:
        ipv4_address: ${GATEWAY_ATTACKER_IP}
      net-victim:
        ipv4_address: ${GATEWAY_VICTIM_IP}
      net-monitor:
        ipv4_address: ${GATEWAY_MONITOR_IP}
    volumes:
      - ./entrypoints/gateway-entrypoint.sh:/usr/local/bin/gateway-entrypoint.sh:ro
    tty: true
    stdin_open: true
    profiles: ["core", "full"]



  suricata:
    image: ${SURICATA_IMAGE}
    container_name: suricata
    network_mode: "service:gateway"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    depends_on:
      - gateway
    entrypoint: ["/bin/sh", "/suricata-entrypoint.sh"]
    volumes:
      - ./entrypoints/suricata-entrypoint.sh:/suricata-entrypoint.sh:ro
      - suricata-logs:/var/log/suricata
      - suricata-rules:/var/lib/suricata
    profiles: ["core", "full"]



networks:

  net-attacker:
    driver: bridge
    ipam:
      config:
        - subnet: ${ATTACKER_SUBNET} 

  net-victim:
    driver: bridge
    ipam:
      config:
        - subnet: ${VICTIM_SUBNET}

  net-monitor:
    driver: bridge
    ipam:
      config:
        - subnet: ${MONITOR_SUBNET}


volumes:
  suricata-logs:
  suricata-rules:
